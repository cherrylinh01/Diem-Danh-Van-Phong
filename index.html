<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ Thống Điểm Danh - ĐH Bách Khoa TPHCM</title>
  <!-- Thư viện Font Awesome cho Icon chuẩn UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bk-navy: #003366;
      --bk-navy-dark: #001f3f;
      --bk-blue: #0066cc;
      --bk-cyan: #00a8e8;
      --bk-gold: #f59e0b;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: var(--bg-color); 
      margin: 0; 
      padding: 20px 12px; 
      color: var(--text-main); 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card { 
      background: var(--card-bg); 
      border-radius: 16px; 
      padding: 24px; 
      width: 100%;
      max-width: 480px; 
      margin: 0 auto; 
      box-shadow: 0 10px 30px rgba(0, 51, 102, 0.08); 
      border: 1px solid var(--border-color); 
    }
    .logo-header { 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      margin-bottom: 12px; 
      padding-bottom: 12px; 
      border-bottom: 1px solid var(--border-color); 
    }
    .logo-item { 
      width: 45px; 
      height: 45px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }
    .logo-item img { width: 100%; height: 100%; object-fit: contain; }
    .header-title { text-align: center; margin-bottom: 15px; }
    .header-title h3 { color: var(--bk-navy); margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-title h2 { color: var(--bk-navy-dark); margin: 4px 0 0 0; font-size: 18px; font-weight: 800; }
    
    .digital-clock { 
      background: linear-gradient(135deg, var(--bk-navy-dark), var(--bk-navy)); 
      color: white; 
      border-radius: 12px; 
      padding: 12px; 
      text-align: center; 
      margin-bottom: 15px; 
      box-shadow: 0 4px 12px rgba(0, 51, 102, 0.2); 
    }
    .clock-time { font-family: 'Courier New', Courier, monospace; font-size: 26px; font-weight: bold; color: #38bdf8; letter-spacing: 2px; }
    .clock-date { font-size: 12px; margin-top: 4px; color: #cbd5e1; }
    .clock-week { display: inline-block; background: rgba(255, 255, 255, 0.15); padding: 2px 8px; border-radius: 20px; font-weight: 600; color: #fde047; margin-top: 4px; font-size: 11px; }
    
    .tab-container { display: flex; gap: 6px; margin-bottom: 15px; background: #e2e8f0; padding: 4px; border-radius: 10px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 8px; color: #64748b; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .tab-btn.active { background: white; color: var(--bk-navy); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    
    .status-badges { display: flex; gap: 8px; margin-bottom: 15px; }
    .badge { flex: 1; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 12px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #334155; }
    
    .pose-box { background: linear-gradient(135deg, #fffbe3, #fef3c7); border: 1px solid #fde68a; border-radius: 12px; padding: 12px; margin-top: 15px; margin-bottom: 12px; text-align: center; }
    .pose-title { font-size: 11px; font-weight: 700; color: #b45309; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .pose-highlight { color: #92400e; font-size: 14px; font-weight: 800; display: block; margin-top: 6px; line-height: 1.4; }
    
    .form-group { margin-bottom: 12px; text-align: left; }
    label { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 12px; }
    select, input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; background: #fff; color: #1e293b; outline: none; transition: border-color 0.2s; }
    select:focus, input:focus { border-color: var(--bk-blue); box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15); }
    
    .camera-box { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #0f172a; border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 2px solid #334155; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { display: none; }
    .kyc-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 8px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .btn-cam { background: var(--bk-blue); margin-top: 6px; }
    .btn-cam:hover { background: #0052a3; }
    .btn-in { background: #16a34a; }
    .btn-in:hover { background: #15803d; }
    .btn-out { background: #dc2626; }
    .btn-out:hover { background: #b91c1c; }
    .btn-reg { background: #2563eb; margin-top: 8px; }
    .btn-reg:hover { background: #1d4ed8; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; color: #94a3b8; }
    
    #status { margin-top: 15px; font-size: 12px; font-weight: 600; color: #475569; text-align: center; line-height: 1.5; }
    #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 400px; }
    .toast { padding: 12px 16px; border-radius: 10px; background: white; color: #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.15); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; animation: slideDown 0.3s forwards; border-left: 5px solid #2563eb; }
    .toast.success { border-left-color: #16a34a; }
    .toast.error { border-left-color: #dc2626; }
    
    @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* RESPONSIVE LAYOUT BREAKPOINTS */
    @media (min-width: 768px) {
      .card { max-width: 600px; padding: 28px; }
      .header-title h2 { font-size: 20px; }
      .header-title h3 { font-size: 14px; }
      .clock-time { font-size: 30px; }
      .btn { font-size: 14px; padding: 13px; }
    }

    @media (max-width: 400px) {
      body { padding: 8px 4px; }
      .card { padding: 16px 12px; border-radius: 12px; }
      .logo-item { width: 36px; height: 36px; }
      .header-title h2 { font-size: 16px; }
      .clock-time { font-size: 22px; }
      .btn-group { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div class="card">
    <div class="logo-header">
      <div class="logo-item" title="Đoàn Thanh Niên"><img src="https://i.postimg.cc/RZBjLMdG/Logo-Doan-Thanh-NIen-Cong-San-Ho-Chi-Minh-1.webp" alt="Logo Đoàn"></div>
      <div class="logo-item" title="ĐH Bách Khoa"><img src="https://i.postimg.cc/SRJ7FzGT/HCMUT-logo.png" alt="Logo HCMUT"></div>
      <div class="logo-item" title="Hội Sinh Viên"><img src="https://i.postimg.cc/c4QzHpW1/Logo-Hoi-Sinh-Vien-Viet-Nam.webp" alt="Logo Hội Sinh Viên"></div>
      <div class="logo-item" title="Khoa CSE"><img src="https://i.postimg.cc/4dV6PTBb/CSE-logo.png" alt="Logo Khoa CSE"></div>
    </div>
    
    <div class="header-title">
      <h3>BỘ PHẬN VĂN PHÒNG ĐOÀN HỘI KHOA KH-KTMT</h3>
      <h2>HỆ THỐNG ĐIỂM DANH TỰ ĐỘNG</h2>
    </div>
    
    <!-- ĐỒNG HỒ KỸ THUẬT SỐ REALTIME -->
    <div class="digital-clock">
      <div class="clock-time" id="clockTime">00:00:00</div>
      <div class="clock-date" id="clockDate">Đang cập nhật thời gian...</div>
      <div class="clock-week" id="clockWeek">Đang tính tuần...</div>
    </div>
    
    <div class="tab-container">
      <button class="tab-btn active" onclick="switchTab('checkin')">
        <i class="fa-solid fa-camera-retro"></i>
        Điểm Danh
      </button>
      <button class="tab-btn" onclick="switchTab('register')">
        <i class="fa-solid fa-mobile-screen-button"></i>
        Đăng Ký Máy
      </button>
    </div>

    <!-- STATUS BADGE GPS -->
    <div class="status-badges">
      <div class="badge">
        <i class="fa-solid fa-location-dot" style="color: #2563eb;"></i>
        <div><b>Định vị GPS:</b> <span id="infoGPS">Đang xác định...</span></div>
      </div>
    </div>

    <!-- TAB 1: ĐIỂM DANH -->
    <div id="tabCheckin">
      <div class="form-group">
        <label for="userName">
          <i class="fa-solid fa-user"></i>
          Họ và Tên:
        </label>
        <select id="userName"><option value="">-- Đang tải danh sách... --</option></select>
      </div>
      
      <div class="form-group">
        <label for="userPin">
          <i class="fa-solid fa-key"></i>
          Mã PIN Cá Nhân:
        </label>
        <input type="password" id="userPin" placeholder="Nhập PIN cá nhân" maxlength="10">
      </div>
      
      <div class="form-group">
        <label for="office">
          <i class="fa-solid fa-building"></i>
          Văn Phòng:
        </label>
        <select id="office">
          <option value="VP_602">Văn Phòng 602</option>
          <option value="VP_608">Thư viện 608</option>
        </select>
      </div>
      
      <!-- THẺ YÊU CẦU ĐỘNG TÁC -->
      <div class="pose-box">
        <div class="pose-title">
          <i class="fa-solid fa-shield-halved"></i>
          Yêu cầu xác thực khuôn mặt
        </div>
        <span id="poseText" class="pose-highlight">Bấm "BẬT CAMERA" để nhận yêu cầu</span>
      </div>

      <!-- CAMERA VỚI KHUNG OVERLAY KYC -->
      <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="kyc-overlay">
          <svg width="100%" height="100%" viewBox="0 0 400 300">
            <ellipse cx="200" cy="140" rx="85" ry="110" fill="none" stroke="#00a8e8" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85"/>
          </svg>
        </div>
      </div>

      <button id="btnStartCam" class="btn btn-cam" onclick="startLiveCamera()">
        <i class="fa-solid fa-video"></i>
        BẬT CAMERA & LẤY YÊU CẦU
      </button>

      <div class="btn-group">
        <button id="btnIn" class="btn btn-in" onclick="submitCheckIn('IN')" disabled>
          <i class="fa-solid fa-right-to-bracket"></i> VÀO CA
        </button>
        <button id="btnOut" class="btn btn-out" onclick="submitCheckIn('OUT')" disabled>
          <i class="fa-solid fa-right-from-bracket"></i> RA CA
        </button>
      </div>
    </div>

    <!-- TAB 2: ĐĂNG KÝ THIẾT BỊ -->
    <div id="tabRegister" style="display:none;">
      <div class="form-group">
        <label for="regUserName">Họ và Tên:</label>
        <select id="regUserName"><option value="">-- Chọn tên để đăng ký --</option></select>
      </div>
      <div class="form-group">
        <label for="regUserPin">Mã PIN Cá Nhân (Tạo mới từ 4 số):</label>
        <input type="password" id="regUserPin" placeholder="Tạo mã PIN cá nhân">
      </div>
      <button class="btn btn-reg" onclick="submitRegister()">
        <i class="fa-solid fa-mobile-screen-button"></i> ĐĂNG KÝ MÁY NÀY
      </button>
    </div>

    <div id="status">
      <i class="fa-solid fa-circle-info"></i> Bấm <b>"BẬT CAMERA & LẤY YÊU CẦU"</b> để bắt đầu.
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzPeBWlVKFlrQU7GPyhYQvKi4nrj0THbJSx3wU6JV40eHmTmTRap1b_gf6-Su7BODw6xw/exec";
    
    // Chuỗi yêu cầu động tác chuẩn hoá không sử dụng icon emoji
    const POSE_LIST = [
      "Giơ 2 ngón tay (V-sign) + Cười tươi",
      "Giơ ngón tay cái (Like) + Nháy mắt một bên",
      "Tạo hình trái tim 2 tay + Cười mỉm",
      "Xòe bàn tay sát má + Há miệng ngạc nhiên",
      "Chỉ 1 ngón tay vào má + Cười nhẹ",
      "Giơ tay ký hiệu OK + Nháy mắt",
      "Đặt 2 ngón tay dưới cằm (V-line) + Cười tươi",
      "Nắm tay giơ ngang ngực + Mặt nghiêm túc",
      "Ký hiệu I Love You + Cười tươi",
      "Giơ tay vẫy nhẹ + Cười mở miệng"
    ];
    
    let currentPose = "Chưa lấy yêu cầu";
    let cameraStream = null;
    let userLat = null, userLng = null;

    window.onload = function() {
      startDigitalClock();
      getGeoLocation();
      loadMemberList();
    };

    function startDigitalClock() {
      function update() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clockTime').innerText = `${hrs}:${mins}:${secs}`;
        
        const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
        const dayName = days[now.getDay()];
        const date = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        document.getElementById('clockDate').innerText = `${dayName}, ${date}/${month}/${year}`;
        
        const anchorMonday = new Date(2026, 7, 3);
        const currMonday = new Date(now);
        const day = currMonday.getDay();
        const diffToMonday = currMonday.getDate() - day + (day === 0 ? -6 : 1);
        currMonday.setDate(diffToMonday);
        currMonday.setHours(0,0,0,0);
        
        const diffWeeks = Math.round((currMonday - anchorMonday) / (7 * 24 * 60 * 60 * 1000));
        const weekNum = 32 + diffWeeks;
        const weekType = (weekNum % 2 === 0) ? "Chẵn" : "Lẻ";
        document.getElementById('clockWeek').innerText = `Tuần ${weekNum} (${weekType})`;
      }
      setInterval(update, 1000);
      update();
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      let iconClass = 'fa-solid fa-circle-info';
      if (type === 'success') iconClass = 'fa-solid fa-circle-check';
      if (type === 'error') iconClass = 'fa-solid fa-triangle-exclamation';

      toast.innerHTML = `<i class="${iconClass}"></i><span>${message}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'checkin') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tabCheckin').style.display = 'block';
        document.getElementById('tabRegister').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tabCheckin').style.display = 'none';
        document.getElementById('tabRegister').style.display = 'block';
      }
    }

    function getGeoLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            document.getElementById('infoGPS').innerText = `${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;
          },
          err => { document.getElementById('infoGPS').innerText = 'Chưa bật GPS'; },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        document.getElementById('infoGPS').innerText = 'Không hỗ trợ GPS';
      }
    }

    function loadMemberList() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(populateNames).getMemberList();
      } else {
        fetch(GAS_WEB_APP_URL + "?api=getNames")
          .then(res => res.json())
          .then(populateNames)
          .catch(() => { 
            document.getElementById('status').innerHTML = '<i class="fa-solid fa-circle-xmark" style="color:#dc2626"></i> Lỗi tải danh sách tên!'; 
          });
      }
    }

    function populateNames(names) {
      ['userName', 'regUserName'].forEach(id => {
        const select = document.getElementById(id);
        select.innerHTML = '<option value="">-- Chọn Họ và Tên --</option>';
        names.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n; opt.textContent = n;
          select.appendChild(opt);
        });
      });
    }

    function generateRandomPose() {
      const randomIndex = Math.floor(Math.random() * POSE_LIST.length);
      currentPose = POSE_LIST[randomIndex];
      document.getElementById('poseText').innerText = currentPose;
    }

    async function startLiveCamera() {
      const video = document.getElementById('webcam');
      document.getElementById('status').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang bật Camera...';
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 } });
        video.srcObject = cameraStream;
        await video.play();
        generateRandomPose();
        
        const btnCam = document.getElementById('btnStartCam');
        btnCam.innerHTML = '<i class="fa-solid fa-circle-check"></i> CAMERA ĐÃ BẬT';
        btnCam.disabled = true;
        document.getElementById('btnIn').disabled = false;
        document.getElementById('btnOut').disabled = false;
        
        document.getElementById('status').innerHTML = '<i class="fa-solid fa-circle-check" style="color:#16a34a"></i> Căn mặt vào ô elip & làm đúng động tác rồi bấm Vào/Ra ca!';
        showToast("Camera đã bật thành công!", "success");
      } catch (e) {
        document.getElementById('status').innerHTML = '<i class="fa-solid fa-circle-xmark" style="color:#dc2626"></i> Bạn đã chặn quyền sử dụng Camera!';
        showToast("Vui lòng cho phép quyền truy cập Camera!", "error");
      }
    }

    function generateDeviceId() {
      let id = localStorage.getItem('DEVICE_ID');
      if (!id) {
        id = 'DEV_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        localStorage.setItem('DEVICE_ID', id);
      }
      return id;
    }

    async function submitRegister() {
      const name = document.getElementById('regUserName').value;
      const pin = document.getElementById('regUserPin').value;
      if (!name || !pin) return showToast('Vui lòng chọn Tên và nhập Mã PIN!', 'error');
      
      document.getElementById('status').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang đăng ký thiết bị...';
      const payload = { action: 'registerDevice', name: name, pin: pin, deviceId: generateDeviceId() };
      
      sendDataToServer(payload, (res) => {
        showToast(res.message, res.success ? 'success' : 'error');
        document.getElementById('status').innerText = res.message;
        if (res.success) switchTab('checkin');
      });
    }

    async function submitCheckIn(actionType) {
      const name = document.getElementById('userName').value;
      const pin = document.getElementById('userPin').value;
      const office = document.getElementById('office').value;
      
      if (!name) return showToast('Vui lòng chọn Họ và Tên!', 'error');
      if (!pin) return showToast('Vui lòng nhập Mã PIN!', 'error');
      if (!cameraStream) return showToast('Vui lòng bật Camera!', 'error');
      
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      canvas.width = 400; canvas.height = 300;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageBase64 = canvas.toDataURL('image/jpeg', 0.65);
      
      document.getElementById('btnIn').disabled = true;
      document.getElementById('btnOut').disabled = true;
      document.getElementById('status').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý điểm danh và lưu ảnh...';
      
      const payload = {
        name: name, 
        pin: pin, 
        deviceId: generateDeviceId(), 
        office: office,
        actionType: actionType, 
        userLat: userLat, 
        userLng: userLng, 
        imageBase64: imageBase64, 
        poseRequired: currentPose
      };
      
      sendDataToServer(payload, (res) => {
        document.getElementById('btnIn').disabled = false;
        document.getElementById('btnOut').disabled = false;
        document.getElementById('status').innerText = res.message;
        showToast(res.message, res.success ? 'success' : 'error');
      });
    }

    function sendDataToServer(payload, callback) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        if (payload.action === 'registerDevice') {
          google.script.run.withSuccessHandler(callback).registerDevice(payload);
        } else {
          google.script.run.withSuccessHandler(callback).processCheckIn(payload);
        }
      } else {
        fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(callback)
        .catch(err => {
          document.getElementById('btnIn').disabled = false;
          document.getElementById('btnOut').disabled = false;
          document.getElementById('status').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#dc2626"></i> Lỗi kết nối Server!';
          showToast('Lỗi kết nối Server!', 'error');
        });
      }
    }
  </script>
</body>
</html>
