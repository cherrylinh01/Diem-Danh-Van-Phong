<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ Thống Điểm Danh - ĐH Bách Khoa TPHCM</title>
  <style>
    :root {
      --bk-navy: #003366;
      --bk-navy-dark: #001f3f;
      --bk-blue: #0066cc;
      --bk-cyan: #00a8e8;
      --bk-gold: #f59e0b;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); margin: 0; padding: 15px 10px; color: var(--text-main); }
    
    .card { background: var(--card-bg); border-radius: 16px; padding: 20px; max-width: 450px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0, 51, 102, 0.08); border: 1px solid var(--border-color); }
    
    /* 1. LOGO BRANDING BANNER */
    .logo-header { display: flex; justify-content: space-around; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .logo-item { width: 45px; height: 45px; border-radius: 50%; background: #eef6ff; display: flex; justify-content: center; align-items: center; border: 1px solid #cbd5e1; font-weight: bold; font-size: 10px; color: var(--bk-navy); text-align: center; overflow: hidden; }
    .logo-item img { width: 100%; height: 100%; object-fit: contain; }

    .header-title { text-align: center; margin-bottom: 15px; }
    .header-title h3 { color: var(--bk-navy); margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-title h2 { color: var(--bk-navy-dark); margin: 4px 0 0 0; font-size: 18px; font-weight: 800; }

    /* 2. ĐỒNG HỒ KỸ THUẬT SỐ & TUẦN CHẴN/LẺ */
    .digital-clock { background: linear-gradient(135deg, var(--bk-navy-dark), var(--bk-navy)); color: white; border-radius: 12px; padding: 12px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(0, 51, 102, 0.2); }
    .clock-time { font-family: 'Courier New', Courier, monospace; font-size: 26px; font-weight: bold; color: #38bdf8; letter-spacing: 2px; }
    .clock-date { font-size: 12px; margin-top: 4px; color: #cbd5e1; }
    .clock-week { display: inline-block; background: rgba(255, 255, 255, 0.15); padding: 2px 8px; border-radius: 20px; font-weight: 600; color: #fde047; margin-top: 4px; font-size: 11px; }

    /* TAB BUTTONS */
    .tab-container { display: flex; gap: 6px; margin-bottom: 15px; background: #e2e8f0; padding: 4px; border-radius: 10px; }
    .tab-btn { flex: 1; padding: 9px; border: none; background: transparent; font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 8px; color: #64748b; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab-btn.active { background: white; color: var(--bk-navy); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

    /* BADGES IP & GPS */
    .status-badges { display: flex; gap: 8px; margin-bottom: 15px; }
    .badge { flex: 1; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 11px; display: flex; align-items: center; gap: 6px; color: #334155; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }

    /* 3. THẺ YÊU CẦU ĐỘNG TÁC (CHALLENGE CARD) */
    .pose-box { background: linear-gradient(135deg, #fffbe3, #fef3c7); border: 1px solid #fde68a; border-radius: 12px; padding: 12px; margin-top: 15px; margin-bottom: 10px; text-align: center; position: relative; }
    .pose-title { font-size: 11px; font-weight: 700; color: #b45309; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .pose-highlight { color: #92400e; font-size: 15px; font-weight: 800; display: block; margin-top: 5px; line-height: 1.3; }

    /* FORM STYLING */
    .form-group { margin-bottom: 12px; text-align: left; }
    label { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 5px; color: #334155; font-size: 12px; }
    select, input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 13px; background: #fff; color: #1e293b; outline: none; transition: border-color 0.2s; }
    select:focus, input:focus { border-color: var(--bk-blue); box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15); }

    /* 4. CAMERA & KHUNG OVERLAY KYC */
    .camera-box { position: relative; width: 100%; height: 250px; background: #0f172a; border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 2px solid #334155; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { display: none; }
    .kyc-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; }

    /* BUTTONS */
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .btn-cam { background: var(--bk-blue); }
    .btn-cam:hover { background: #0052a3; }
    .btn-in { background: #16a34a; }
    .btn-out { background: #dc2626; }
    .btn-reg { background: #2563eb; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; color: #94a3b8; }
    #status { margin-top: 15px; font-size: 12px; font-weight: 600; color: #475569; white-space: pre-line; text-align: center; }

    /* 5. TOAST NOTIFICATION POPUP */
    #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 400px; }
    .toast { padding: 12px 16px; border-radius: 10px; background: white; color: #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.15); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; animation: slideDown 0.3s forwards; border-left: 5px solid #2563eb; }
    .toast.success { border-left-color: #16a34a; }
    .toast.error { border-left-color: #dc2626; }
    @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>

  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwkp2WoJSSxsTX-ylUCvFpwTLKCujUsCKjTFc2EK9X6uIIFogvKq9IkQ1og2TnIV4zfvA/exec";

    // DANH SÁCH ĐỘNG TÁC TAY & BIỂU CẢM NGẪU NHIÊN
    const POSE_LIST = [
      "✌️ Giơ 2 ngón tay (V-sign) + 😊 Cười tươi",
      "👍 Giơ ngón tay cái (Like) + 😉 Nháy mắt một bên",
      "🫶 Bắn tim 2 tay + 😍 Cười mỉm",
      "🖐️ Xòe bàn tay sát má + 😮 Há miệng ngạc nhiên",
      "👈 Chỉ 1 ngón tay vào má + 😊 Cười nhẹ",
      "👌 Giơ tay ký hiệu OK + 😉 Nháy mắt",
      "🤞 Đặt 2 ngón tay dưới cằm (V-line) + 😃 Cười tươi",
      "✊ Nắm tay giơ ngang ngực + 😐 Mặt nghiêm túc",
      "🤟 Ký hiệu I Love You + 😊 Cười tươi",
      "👋 Giơ tay vẫy nhẹ + 😃 Cười mở miệng"
    ];

    let currentPose = "Chưa lấy yêu cầu";
    let cameraStream = null;
    let userLat = null, userLng = null, userIP = '';

    window.onload = function() {
      startDigitalClock();
      getGeoAndIP();
      loadMemberList();
    };

    // ĐỒNG HỒ REALTIME & TÍNH TUẦN CHẴN / LẺ
    function startDigitalClock() {
      function update() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clockTime').innerText = `${hrs}:${mins}:${secs}`;

        const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
        const dayName = days[now.getDay()];
        const date = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        document.getElementById('clockDate').innerText = `${dayName}, ${date}/${month}/${year}`;

        // THUẬT TOÁN TÍNH TUẦN CHẴN/LẺ (Anchor: Tuần bắt đầu ngày 03/08/2026 là Tuần 32)
        const anchorMonday = new Date(2026, 7, 3);
        const currMonday = new Date(now);
        const day = currMonday.getDay();
        const diffToMonday = currMonday.getDate() - day + (day === 0 ? -6 : 1);
        currMonday.setDate(diffToMonday);
        currMonday.setHours(0,0,0,0);

        const diffWeeks = Math.round((currMonday - anchorMonday) / (7 * 24 * 60 * 60 * 1000));
        const weekNum = 32 + diffWeeks;
        const weekType = (weekNum % 2 === 0) ? "Chẵn" : "Lẻ";
        
        document.getElementById('clockWeek').innerText = `Tuần ${weekNum} (${weekType})`;
      }
      setInterval(update, 1000);
      update();
    }

    // THÔNG BÁO TOAST THAY CHO ALERT()
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'checkin') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tabCheckin').style.display = 'block';
        document.getElementById('tabRegister').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tabCheckin').style.display = 'none';
        document.getElementById('tabRegister').style.display = 'block';
      }
    }

    function getGeoAndIP() {
      fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => { userIP = data.ip; document.getElementById('infoIP').innerText = userIP; })
        .catch(() => { document.getElementById('infoIP').innerText = 'Không lấy được IP'; });

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            document.getElementById('infoGPS').innerText = `${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;
          },
          err => { document.getElementById('infoGPS').innerText = 'Chưa bật GPS'; },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        document.getElementById('infoGPS').innerText = 'Không hỗ trợ GPS';
      }
    }

    function loadMemberList() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(populateNames).getMemberList();
      } else {
        fetch(GAS_WEB_APP_URL + "?api=getNames")
          .then(res => res.json())
          .then(populateNames)
          .catch(() => { document.getElementById('status').innerText = '❌ Lỗi tải danh sách tên!'; });
      }
    }

    function populateNames(names) {
      ['userName', 'regUserName'].forEach(id => {
        const select = document.getElementById(id);
        select.innerHTML = '<option value="">-- Chọn Họ và Tên --</option>';
        names.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n; opt.textContent = n;
          select.appendChild(opt);
        });
      });
    }

    function generateRandomPose() {
      const randomIndex = Math.floor(Math.random() * POSE_LIST.length);
      currentPose = POSE_LIST[randomIndex];
      document.getElementById('poseText').innerText = currentPose;
    }

    async function startLiveCamera() {
      const video = document.getElementById('webcam');
      document.getElementById('status').innerText = '⏳ Đang bật Camera...';
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 } });
        video.srcObject = cameraStream;
        await video.play();
        
        generateRandomPose();

        const btnCam = document.getElementById('btnStartCam');
        btnCam.innerHTML = '✅ CAMERA ĐÃ BẬT';
        btnCam.disabled = true;

        document.getElementById('btnIn').disabled = false;
        document.getElementById('btnOut').disabled = false;
        document.getElementById('status').innerText = '✅ Căn mặt vào ô elip & làm đúng động tác rồi bấm Vào/Ra ca!';
        showToast("Camera đã bật thành công!", "success");
      } catch (e) {
        document.getElementById('status').innerText = '❌ Bạn đã chặn quyền sử dụng Camera!';
        showToast("Vui lòng cho phép quyền truy cập Camera!", "error");
      }
    }

    function generateDeviceId() {
      let id = localStorage.getItem('DEVICE_ID');
      if (!id) {
        id = 'DEV_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        localStorage.setItem('DEVICE_ID', id);
      }
      return id;
    }

    async function submitRegister() {
      const name = document.getElementById('regUserName').value;
      const pin = document.getElementById('regUserPin').value;
      if (!name || !pin) return showToast('Vui lòng chọn Tên và nhập Mã PIN!', 'error');

      document.getElementById('status').innerText = '⏳ Đang đăng ký thiết bị...';
      const payload = { action: 'registerDevice', name: name, pin: pin, deviceId: generateDeviceId() };

      sendDataToServer(payload, (res) => {
        showToast(res.message, res.success ? 'success' : 'error');
        document.getElementById('status').innerText = res.message;
        if (res.success) switchTab('checkin');
      });
    }

    async function submitCheckIn(actionType) {
      const name = document.getElementById('userName').value;
      const pin = document.getElementById('userPin').value;
      const office = document.getElementById('office').value;

      if (!name) return showToast('Vui lòng chọn Họ và Tên!', 'error');
      if (!pin) return showToast('Vui lòng nhập Mã PIN!', 'error');
      if (!cameraStream) return showToast('Vui lòng bật Camera!', 'error');

      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      canvas.width = 400; canvas.height = 300;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageBase64 = canvas.toDataURL('image/jpeg', 0.65);

      document.getElementById('btnIn').disabled = true;
      document.getElementById('btnOut').disabled = true;
      document.getElementById('status').innerText = '⏳ Đang xử lý điểm danh và lưu ảnh...';

      const payload = {
        name: name, 
        pin: pin, 
        deviceId: generateDeviceId(), 
        office: office,
        actionType: actionType, 
        userLat: userLat, 
        userLng: userLng, 
        userIP: userIP,
        imageBase64: imageBase64, 
        poseRequired: currentPose
      };

      sendDataToServer(payload, (res) => {
        document.getElementById('btnIn').disabled = false;
        document.getElementById('btnOut').disabled = false;
        document.getElementById('status').innerText = res.message;
        showToast(res.message, res.success ? 'success' : 'error');
      });
    }

    function sendDataToServer(payload, callback) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        if (payload.action === 'registerDevice') {
          google.script.run.withSuccessHandler(callback).registerDevice(payload);
        } else {
          google.script.run.withSuccessHandler(callback).processCheckIn(payload);
        }
      } else {
        fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(callback)
        .catch(err => {
          document.getElementById('btnIn').disabled = false;
          document.getElementById('btnOut').disabled = false;
          document.getElementById('status').innerText = '❌ Lỗi kết nối Server: ' + err;
          showToast('Lỗi kết nối Server!', 'error');
        });
      }
    }
  </script>
</body>
</html>
